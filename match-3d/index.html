<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#12141a" />
    <title>Pair Pop 3D</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css?v=27" />
  </head>
  <body>
    <div class="app">
      <section id="screen-menu" class="screen">
        <header class="topbar">
          <div id="menu-coins" class="coins"><span class="coin-ic"></span><span class="coin-count">0</span></div>
          <div></div>
          <div class="lang-row">
            <button class="lang-btn music-btn" data-music type="button" aria-label="Music">♪</button>
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="ru" type="button">RU</button>
          </div>
        </header>
        <div class="brand">
          <p id="tagline">FIND THE PAIR</p>
          <h1>Pair Pop</h1>
        </div>
        <div id="menu-toys" class="menu-toys"></div>
        <p class="lead" id="lead">
          Tap toys from the pile, pair two identical ones in the 6-slot tray, and clear the goals before time runs out. Gray stones only get in the way.
        </p>
        <div class="menu-actions">
          <button id="btn-play" class="btn" type="button">Play</button>
          <button id="btn-levels" class="btn secondary" type="button">Levels</button>
        </div>
      </section>

      <section id="screen-levels" class="screen hidden">
        <div class="topbar">
          <button id="btn-back" class="chip" type="button">Back</button>
          <h2 id="levels-title">Levels</h2>
          <div class="lang-row">
            <button class="lang-btn music-btn" data-music type="button" aria-label="Music">♪</button>
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="ru" type="button">RU</button>
          </div>
        </div>
        <div id="level-grid"></div>
      </section>

      <section id="screen-game" class="screen hidden">
        <header class="topbar game-top">
          <div id="hud-level">LEVEL 1</div>
          <div id="hud-time" class="timer"><span class="clock"></span><span id="hud-time-text">0:45</span></div>
          <div class="hud-right">
            <div id="hud-coins" class="coins"><span class="coin-ic"></span><span class="coin-count">0</span></div>
            <div class="lang-row">
              <button class="lang-btn music-btn" data-music type="button" aria-label="Music">♪</button>
              <button class="lang-btn active" data-lang="en" type="button">EN</button>
              <button class="lang-btn" data-lang="ru" type="button">RU</button>
            </div>
          </div>
        </header>
        <div id="goals" class="goals"></div>
        <div class="stage">
          <canvas id="view"></canvas>
          <div id="bomb-hint" class="bomb-hint hidden">Tap the pile to throw the bomb</div>
        </div>
        <div class="tray-wrap">
          <div id="tray" class="tray">
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
            <div class="slot"></div>
          </div>
        </div>
        <div class="boosters">
          <button id="btn-bomb" class="booster" type="button">
            <span class="booster-ic bomb-ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="7" fill="currentColor"/><path d="M14 8l3-4M17 4c1.2.4 2 1.6 2 3" fill="none" stroke="#ffe566" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <span id="lbl-bomb">Bomb</span>
            <span class="cost"><span class="coin-ic tiny"></span><span id="bomb-cost">30</span></span>
          </button>
          <button id="btn-shuffle" class="booster" type="button">
            <span class="booster-ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M4 7h4l2 3h8M4 17h4l2-3h8M16 4l4 3-4 3M16 14l4 3-4 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span id="lbl-shuffle">Shuffle</span>
          </button>
          <button id="btn-restart" class="booster" type="button">
            <span class="booster-ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.2-5.5M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </span>
            <span id="lbl-restart">Retry</span>
          </button>
          <button id="btn-menu" class="booster" type="button">
            <span class="booster-ic" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </span>
            <span id="lbl-menu">Menu</span>
          </button>
        </div>
      </section>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="modal">
        <h3 id="overlay-title">You win!</h3>
        <p id="overlay-detail"></p>
        <div class="overlay-actions">
          <button id="btn-next" class="btn" type="button">Next</button>
          <button id="btn-ad" class="btn secondary hidden" type="button">Watch ad +1:00</button>
          <button id="btn-retry" class="btn secondary" type="button">Retry</button>
          <button id="btn-overlay-menu" class="chip" type="button">Levels</button>
        </div>
      </div>
    </div>

    <div id="ad-overlay" class="hidden">
      <div class="modal">
        <h3>Rewarded ad</h3>
        <p>Placeholder until the real SDK is connected.</p>
        <p id="ad-count">3</p>
      </div>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
    <script src="js/config.js?v=27c"></script>
    <script src="js/levels.js?v=27c"></script>
    <script src="js/items.js?v=27c"></script>
    <script src="js/ads.js?v=27c"></script>
    <script src="js/audio.js?v=27c"></script>
    <script src="js/game.js?v=27d"></script>
  </body>
</html>
