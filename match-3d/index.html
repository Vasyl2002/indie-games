<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#140824" />
    <title>Pair Pop 3D</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="stars"></div>
    <div class="app">
      <section id="screen-menu" class="screen">
        <header class="hud menu-hud">
          <div></div>
          <div></div>
          <div class="lang-row">
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="ru" type="button">RU</button>
          </div>
        </header>
        <div class="brand">
          <p id="tagline">3D MATCH</p>
          <h1><span class="a">Pair</span><span class="b">Pop</span></h1>
        </div>
        <p class="lead" id="lead">
          Tap toys from the pile, pair two identical ones in the 6-slot tray, and clear the goals before time runs out.
        </p>
        <div class="menu-actions">
          <button id="btn-play" class="btn" type="button">Play</button>
          <button id="btn-levels" class="btn secondary" type="button">Levels</button>
        </div>
      </section>

      <section id="screen-levels" class="screen hidden">
        <div class="hud">
          <button id="btn-back" class="btn ghost" type="button">Back</button>
          <h2 id="levels-title">Levels</h2>
          <div class="lang-row">
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="ru" type="button">RU</button>
          </div>
        </div>
        <div id="level-grid"></div>
      </section>

      <section id="screen-game" class="screen hidden">
        <header class="hud">
          <div id="hud-level">LEVEL 1</div>
          <div id="hud-time" class="timer"><span class="clock"></span><span id="hud-time-text">0:45</span></div>
          <div class="lang-row">
            <button class="lang-btn active" data-lang="en" type="button">EN</button>
            <button class="lang-btn" data-lang="ru" type="button">RU</button>
          </div>
        </header>
        <div id="goals" class="goals"></div>
        <div class="stage"><canvas id="view"></canvas></div>
        <div id="tray" class="tray"></div>
        <div class="toolbar">
          <button id="btn-shuffle" class="btn ghost" type="button">Shuffle</button>
          <button id="btn-restart" class="btn secondary" type="button">Restart</button>
          <button id="btn-menu" class="btn ghost" type="button">Menu</button>
        </div>
      </section>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="modal">
        <h3 id="overlay-title">You win!</h3>
        <p id="overlay-detail"></p>
        <div class="overlay-actions">
          <button id="btn-next" class="btn" type="button">Next</button>
          <button id="btn-ad" class="btn secondary hidden" type="button">Watch ad +1:00</button>
          <button id="btn-retry" class="btn secondary" type="button">Retry</button>
          <button id="btn-overlay-menu" class="btn ghost" type="button">Levels</button>
        </div>
      </div>
    </div>

    <div id="ad-overlay" class="hidden">
      <div class="modal">
        <h3>Rewarded ad</h3>
        <p>Placeholder until the real SDK is connected.</p>
        <p id="ad-count">3</p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script>
    <script src="js/config.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/items.js"></script>
    <script src="js/ads.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
